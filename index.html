<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Phone Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at center, #1a191e 0%, #0c0c0e 48%, #050506 100%);
            color: #fff;
            overflow-x: hidden;
        }

        /* =========================================
           PAGE & SCREEN LAYOUT
        ========================================= */
        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
            position: relative;
        }

        .screen {
            display: none;
            width: min(430px, 100%);
            min-height: 600px;
            position: relative;
            padding: 42px 36px 34px;
            border-radius: 34px;
            background: linear-gradient(145deg, #111114 0%, #0d0d10 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 35px 100px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.025);
            overflow: hidden;
            animation: cardEnter .7s cubic-bezier(.2,.8,.2,1);
        }

        .screen.active {
            display: block;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(25px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* =========================================
           CARD LIGHT
        ========================================= */
        .card-light {
            position: absolute;
            width: 180px;
            height: 180px;
            left: 50%;
            top: -115px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: rgba(255, 128, 38, .12);
            filter: blur(50px);
            transition: background .5s ease;
        }

        .screen.success .card-light {
            background: rgba(30, 215, 143, .17);
        }

        /* =========================================
           PHONE INPUT SCREEN SPECIFICS
        ========================================= */
        .phone-input-wrapper {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: rgba(255,255,255,.5);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .phone-field {
            width: 100%;
            height: 56px;
            background: #17171b;
            border: 1px solid rgba(255,255,255,.055);
            border-radius: 14px;
            color: white;
            font-size: 18px;
            padding: 0 20px;
            outline: none;
            transition: border .2s ease, box-shadow .2s ease;
            letter-spacing: 1px;
        }

        .phone-field:focus {
            border-color: #ff8a34;
            box-shadow: 0 0 0 3px rgba(255, 117, 44, .13), 0 0 20px rgba(255, 117, 44, .18);
        }

        .send-btn {
            width: 100%;
            height: 56px;
            margin-top: 10px;
            background: linear-gradient(90deg, #ff9d1b, #ff7b13);
            color: #2c1704;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 138, 48, .3);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hero-icon {
            font-size: 72px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(255, 150, 45, .2));
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* =========================================
           PHONE AREA (OTP SCREEN)
        ========================================= */
        .phone-area {
            height: 245px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone {
            width: 145px;
            height: 228px;
            position: relative;
            padding: 3px;
            border-radius: 32px;
            background: #272b30;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .58);
            transition: box-shadow .4s ease, transform .4s ease;
        }

        .phone-loader {
            position: absolute;
            inset: -3px;
            border-radius: 35px;
            background: conic-gradient(from 0deg, transparent 0deg, transparent 35deg, #ff6b32 80deg, #ffae38 120deg, #ff413e 165deg, transparent 220deg, transparent 360deg);
            opacity: 0;
            z-index: 0;
            animation: rotateLoader 1.35s linear infinite;
            transition: opacity .3s ease;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 3px;
        }

        .phone.verifying .phone-loader { opacity: 1; }

        @keyframes rotateLoader { to { transform: rotate(360deg); } }

        .phone.verifying::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 38px;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 88, 40, .8) 80deg, transparent 150deg, transparent 260deg, rgba(255, 138, 48, .6) 300deg, transparent 360deg);
            filter: blur(10px);
            opacity: .48;
            z-index: -1;
            animation: rotateLoader 1.5s linear infinite;
        }

        .phone-inner {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            border-radius: 29px;
            overflow: hidden;
            background: radial-gradient(circle at top, rgba(255, 133, 53, .08), transparent 42%), #121417;
            border: 1px solid rgba(255,255,255,.08);
            padding: 12px;
        }

        .phone.verified {
            background: linear-gradient(140deg, #1fcf92, #087455);
            box-shadow: 0 0 40px rgba(22, 215, 143, .25);
        }

        .phone.verified .phone-inner { background: radial-gradient(circle at top, rgba(25, 220, 150, .12), transparent 43%), #0f1714; }

        .phone-status { display: flex; justify-content: space-between; font-size: 7px; color: rgba(255,255,255,.42); }

        .phone-lock {
            margin-top: 37px;
            text-align: center;
            font-size: 36px;
            filter: drop-shadow(0 0 9px rgba(255, 150, 45, .32));
            transition: transform .4s ease, filter .4s ease;
        }

        .phone.verified .phone-lock { filter: drop-shadow(0 0 10px rgba(22, 225, 150, .38)); transform: scale(1.06); }

        .phone-button {
            position: absolute; left: 20px; right: 20px; bottom: 38px; height: 28px;
            border: none; border-radius: 7px; background: linear-gradient(90deg, #ff9d1b, #ff7b13);
            color: #2c1704; font-size: 8px; font-weight: 800; transition: background .4s ease, color .4s ease;
        }

        .phone.verified .phone-button { background: #1cc98e; color: #06291d; }

        .phone-home {
            position: absolute; width: 32px; height: 3px; border-radius: 20px;
            background: rgba(255,255,255,.17); left: 50%; bottom: 12px; transform: translateX(-50%);
        }

        .floating-mail {
            position: absolute; left: 40px; bottom: 45px; width: 32px; height: 25px;
            display: flex; align-items: center; justify-content: center; border-radius: 4px;
            background: white; color: #e54f43; font-size: 19px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
            animation: floatMail 3s ease-in-out infinite;
        }

        .floating-shield {
            position: absolute; right: 38px; top: 64px; color: #31bde4; font-size: 36px;
            opacity: .78; animation: floatShield 4s ease-in-out infinite;
        }

        @keyframes floatMail {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        @keyframes floatShield {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        /* =========================================
           CONTENT
        ========================================= */
        .content { text-align: center; margin-top: 12px; }
        .content h1 { font-size: 24px; font-weight: 700; letter-spacing: -.5px; transition: color .4s ease; }
        .content p { margin-top: 10px; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.32); }
        .screen.verifying .content h1 { color: #ffab5b; }
        
        .error-message {
            color: #ff5c5c;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            min-height: 15px;
        }

        /* =========================================
           OTP
        ========================================= */
        .otp-container {
            display: flex; justify-content: center; gap: 8px; margin-top: 28px;
        }

        .otp-input {
            width: 44px; height: 52px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,.055); outline: none; background: #17171b;
            color: white; font-size: 20px; font-weight: 600; text-align: center;
            caret-color: #ff9237; transition: border .2s ease, box-shadow .2s ease, transform .2s ease, background .2s ease;
        }

        .otp-input:focus { transform: translateY(-3px); }
        .otp-input.active { border-color: #ff8a34; box-shadow: 0 0 0 3px rgba(255, 117, 44, .13), 0 0 20px rgba(255, 117, 44, .18); }
        .otp-input.filled { background: #1c1c20; animation: digitPop .22s ease; }

        @keyframes digitPop { from { transform: scale(.82); } to { transform: scale(1); } }

        /* =========================================
           STATUS & RESEND
        ========================================= */
        .status-row { min-height: 18px; margin-top: 10px; text-align: center; }
        #statusText { font-size: 11px; color: #ff9460; }
        
        .timer-row { margin-top: 16px; text-align: center; font-size: 14px; font-weight: 600; color: #ff9b39; letter-spacing: 1px; }

        .resend-row { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,.30); }
        .resend-row button { background: transparent; border: none; color: white; font-size: 11px; font-weight: 700; cursor: pointer; transition: color 0.3s ease, opacity 0.3s ease; }
        .resend-row button:disabled { opacity: 0.4; cursor: not-allowed; }
        .resend-row button:not(:disabled):hover { color: #ff9b39; }

        /* =========================================
           SUCCESS
        ========================================= */
        .success-screen { text-align: center; padding-top: 10px; animation: successEnter .55s ease; }
        @keyframes successEnter { from { opacity: 0; transform: scale(.84) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .success-check {
            width: 65px; height: 65px; margin: 8px auto 20px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: #18c98c; color: #062b1e; font-size: 34px; font-weight: 900;
            box-shadow: 0 0 0 7px rgba(24,201,140,.07), 0 0 30px rgba(24,201,140,.28); animation: checkPop .65s cubic-bezier(.2,1.4,.4,1);
        }

        @keyframes checkPop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .success-screen h2 { font-size: 24px; color: #24dca2; }
        .success-screen p { margin-top: 9px; font-size: 13px; color: rgba(255,255,255,.33); }
        .success-restart {
            width: 40px; height: 40px; margin-top: 24px; border: none; border-radius: 50%; background: #18c98c;
            color: #062a1d; font-size: 20px; cursor: pointer; transition: transform .25s ease, box-shadow .25s ease;
        }
        .success-restart:hover { transform: rotate(180deg); box-shadow: 0 0 20px rgba(24,201,140,.3); }

        .hidden { display: none !important; }

        /* =========================================
           MOBILE
        ========================================= */
        @media (max-width: 520px) {
            .page { padding: 20px 12px; }
            .screen { width: min(430px, 100%); min-height: 580px; padding: 34px 20px 28px; }
            .otp-container { gap: 6px; }
            .otp-input { width: 38px; height: 46px; font-size: 18px; }
            .floating-mail { left: 24px; }
            .floating-shield { right: 24px; }
        }
    </style>
</head>
<body>

<div class="page">
    <!-- Invisible reCAPTCHA Container (Required by Firebase) -->
    <div id="recaptcha-container"></div>

    <!-- =========================================
         SCREEN 1: PHONE NUMBER INPUT
    ========================================= -->
    <section class="screen active" id="inputScreen">
        <div class="card-light"></div>
        
        <div class="hero-icon">📱</div>

        <div class="content">
            <h1>Welcome Back</h1>
            <p>Enter your mobile number to securely<br>sign in to your account.</p>
        </div>

        <div class="phone-input-wrapper">
            <div class="input-group">
                <label for="phoneNumber">Phone Number (with Country Code)</label>
                <input type="tel" id="phoneNumber" class="phone-field" placeholder="+91 98765 43210" autocomplete="tel">
                <div id="inputError" class="error-message"></div>
            </div>

            <button id="requestOtpBtn" class="send-btn">Get verification code</button>
        </div>
    </section>

    <!-- =========================================
         SCREEN 2: OTP VERIFICATION
    ========================================= -->
    <section class="screen" id="otpCard">
        <div class="card-light"></div>

        <div class="phone-area">
            <div class="floating-mail">✉</div>
            <div class="floating-shield">♢</div>

            <div class="phone" id="phone">
                <div class="phone-loader"></div>
                <div class="phone-inner">
                    <div class="phone-status">
                        <span>9:41</span>
                        <span>● ●</span>
                    </div>
                    <div class="phone-lock" id="phoneLock">🔒</div>
                    <button class="phone-button" id="phoneButton">Verify</button>
                    <div class="phone-home"></div>
                </div>
            </div>
        </div>

        <div class="content" id="content">
            <h1 id="mainTitle">Verify your number</h1>
            <p id="subtitle">
                We've sent a 6-digit code to <strong id="displayNumber"></strong>.<br>
                It'll auto-verify once entered.
            </p>
        </div>

        <!-- 6-Digit Container -->
        <div class="otp-container" id="otpContainer">
            <input class="otp-input active" maxlength="1" inputmode="numeric" aria-label="OTP digit 1">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 2">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 3">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 4">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 5">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 6">
        </div>

        <div class="status-row" id="statusRow">
            <span id="statusText"></span>
        </div>

        <div class="timer-row" id="timerRow">00:30</div>

        <div class="resend-row" id="resendRow">
            <span>Didn't receive the code?</span>
            <button id="resendButton" disabled>Resend</button>
        </div>

        <div class="success-screen hidden" id="successScreen">
            <div class="success-check">✓</div>
            <h2>Number Verified!</h2>
            <p>Your number has been securely verified</p>
            <button class="success-restart" id="restartButton" aria-label="Verify again">↻</button>
        </div>
    </section>
</div>

<!-- =========================================
     JAVASCRIPT LOGIC
========================================= -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAlp2ME-QiCCqM_EWQQ_TRWz0GkBvYABtw",
        authDomain: "otp-auth-5d475.firebaseapp.com",
        projectId: "otp-auth-5d475",
        storageBucket: "otp-auth-5d475.firebasestorage.app",
        messagingSenderId: "400867927315",
        appId: "1:400867927315:web:6f430ad49bea864417a6e6"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let confirmationResult = null;
    let currentUserNumber = "";

    // DOM Elements - Screen 1
    const inputScreen = document.getElementById("inputScreen");
    const phoneNumberInput = document.getElementById("phoneNumber");
    const requestOtpBtn = document.getElementById("requestOtpBtn");
    const inputError = document.getElementById("inputError");
    
    // DOM Elements - Screen 2
    const otpCard = document.getElementById("otpCard");
    const displayNumber = document.getElementById("displayNumber");
    const otpInputs = document.querySelectorAll(".otp-input");
    const phone = document.getElementById("phone");
    const phoneLock = document.getElementById("phoneLock");
    const phoneButton = document.getElementById("phoneButton");
    const mainTitle = document.getElementById("mainTitle");
    const otpContainer = document.getElementById("otpContainer");
    const statusRow = document.getElementById("statusRow");
    const statusText = document.getElementById("statusText");
    const resendRow = document.getElementById("resendRow");
    const resendButton = document.getElementById("resendButton");
    const timerRow = document.getElementById("timerRow");
    const successScreen = document.getElementById("successScreen");
    const restartButton = document.getElementById("restartButton");

    let countdownTime = 30;
    let timerInterval;

    /* =========================================
       INITIALIZE RECAPTCHA
    ========================================= */
    window.addEventListener("load", () => {
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'requestOtpBtn', {
            'size': 'invisible',
            'callback': (response) => {
                // reCAPTCHA solved, handled implicitly by signInWithPhoneNumber
            }
        });
    });

    /* =========================================
       STEP 1: REQUEST SMS
    ========================================= */
    requestOtpBtn.addEventListener("click", () => {
        const rawNumber = phoneNumberInput.value.trim();
        
        // Basic validation (must start with + and have at least 10 digits)
        if (!rawNumber.startsWith("+") || rawNumber.replace(/\D/g, '').length < 10) {
            inputError.textContent = "Please enter a valid number with country code (e.g. +91...)";
            return;
        }

        inputError.textContent = "";
        requestOtpBtn.disabled = true;
        requestOtpBtn.textContent = "Sending Code...";
        currentUserNumber = rawNumber;

        signInWithPhoneNumber(auth, currentUserNumber, window.recaptchaVerifier)
            .then((result) => {
                confirmationResult = result;
                
                // Transition to Screen 2
                inputScreen.classList.remove("active");
                otpCard.classList.add("active");
                
                // Update UI details
                displayNumber.textContent = currentUserNumber;
                otpInputs[0].focus();
                updateActiveBox(0);
                startCountdown();
                
                statusText.textContent = "Code sent successfully!";
                statusText.style.color = "#24dca2";
            }).catch((error) => {
                console.error("SMS Error:", error);
                
                // Check if it's the domain authorization error
                if (error.code === 'auth/internal-error') {
                    inputError.textContent = "Firebase Error: Domain not authorized. Add this URL to Firebase Console > Auth > Settings > Authorized domains.";
                } else {
                    inputError.textContent = "Failed to send code. Check console for details.";
                }
                
                requestOtpBtn.disabled = false;
                requestOtpBtn.textContent = "Get verification code";
                
                // Safely reset recaptcha if error occurs (catches unhandled promise rejection)
                if(window.recaptchaVerifier) {
                    window.recaptchaVerifier.render().then(widgetId => {
                        grecaptcha.reset(widgetId);
                    }).catch(resetErr => console.warn("Could not reset reCAPTCHA:", resetErr));
                }
            });
    });

    /* =========================================
       STEP 2: OTP INPUT LOGIC
    ========================================= */
    function updateActiveBox(index) {
        otpInputs.forEach((input, i) => input.classList.toggle("active", i === index));
    }

    otpInputs.forEach((input, index) => {
        input.addEventListener("input", () => {
            input.value = input.value.replace(/\D/g, "").slice(0, 1);
            if (input.value) {
                input.classList.add("filled");
                if (index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                    updateActiveBox(index + 1);
                } else {
                    updateActiveBox(index);
                    verifyOTP();
                }
            }
        });

        input.addEventListener("keydown", event => {
            if (event.key === "Backspace" && input.value === "" && index > 0) {
                otpInputs[index - 1].value = "";
                otpInputs[index - 1].classList.remove("filled");
                otpInputs[index - 1].focus();
                updateActiveBox(index - 1);
            }
            if (event.key === "ArrowLeft" && index > 0) {
                otpInputs[index - 1].focus();
                updateActiveBox(index - 1);
            }
            if (event.key === "ArrowRight" && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
                updateActiveBox(index + 1);
            }
        });
    });

    otpContainer.addEventListener("paste", event => {
        event.preventDefault();
        const pasted = event.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);

        pasted.split("").forEach((digit, index) => {
            otpInputs[index].value = digit;
            otpInputs[index].classList.add("filled");
        });

        if (pasted.length === 6) {
            otpInputs[5].focus();
            updateActiveBox(5);
            verifyOTP();
        } else {
            otpInputs[pasted.length].focus();
            updateActiveBox(pasted.length);
        }
    });

    function getOTP() {
        return Array.from(otpInputs).map(input => input.value).join("");
    }

    /* =========================================
       STEP 3: FIREBASE VERIFICATION
    ========================================= */
    function verifyOTP() {
        const enteredOTP = getOTP();
        if (enteredOTP.length !== 6 || !confirmationResult) return;

        otpInputs.forEach(input => input.disabled = true);
        otpCard.classList.add("verifying");
        phone.classList.add("verifying");
        mainTitle.textContent = "Verifying code...";
        statusText.textContent = "Checking your code securely...";
        statusText.style.color = "#ff9460";
        phoneButton.textContent = "Verifying...";

        confirmationResult.confirm(enteredOTP)
            .then((result) => {
                // User signed in successfully
                showSuccess(); 
            })
            .catch((error) => {
                showError(); 
            });
    }

    /* =========================================
       SUCCESS / ERROR STATES
    ========================================= */
    function showSuccess() {
        otpCard.classList.remove("verifying");
        otpCard.classList.add("success");
        phone.classList.remove("verifying");
        phone.classList.add("verified");
        phoneLock.textContent = "🔓";
        phoneButton.textContent = "Verified ✓";
        mainTitle.textContent = "";
        statusText.textContent = "";
        otpContainer.classList.add("hidden");
        timerRow.classList.add("hidden");
        resendRow.classList.add("hidden");
        statusRow.classList.add("hidden");
        document.getElementById("content").classList.add("hidden");
        successScreen.classList.remove("hidden");
    }

    function showError() {
        otpCard.classList.remove("verifying");
        phone.classList.remove("verifying");
        mainTitle.textContent = "Invalid code";
        statusText.textContent = "Please try again";
        statusText.style.color = "#ff5c5c";
        phoneButton.textContent = "Verify";
        otpInputs.forEach(input => input.disabled = false);

        otpCard.animate([
            { transform: "translateX(0)" }, { transform: "translateX(-8px)" },
            { transform: "translateX(8px)" }, { transform: "translateX(-5px)" },
            { transform: "translateX(5px)" }, { transform: "translateX(0)" }
        ], { duration: 400 });

        setTimeout(() => {
            otpInputs.forEach(input => { input.value = ""; input.classList.remove("filled"); });
            statusText.textContent = "";
            mainTitle.textContent = "Verify your number";
            otpInputs[0].focus();
            updateActiveBox(0);
        }, 1000);
    }

    /* =========================================
       TIMER & RESEND LOGIC
    ========================================= */
    function startCountdown() {
        clearInterval(timerInterval);
        countdownTime = 30;
        resendButton.disabled = true;
        timerRow.textContent = `00:${countdownTime}`;

        timerInterval = setInterval(() => {
            countdownTime--;
            const seconds = countdownTime < 10 ? "0" + countdownTime : countdownTime;
            timerRow.textContent = `00:${seconds}`;
            if (countdownTime <= 0) {
                clearInterval(timerInterval);
                resendButton.disabled = false;
            }
        }, 1000);
    }

    resendButton.addEventListener("click", () => {
        resendButton.disabled = true;
        statusText.textContent = "Resending code...";
        statusText.style.color = "#ff9b39";
        
        // Re-trigger Firebase SMS
        signInWithPhoneNumber(auth, currentUserNumber, window.recaptchaVerifier)
            .then((result) => {
                confirmationResult = result;
                startCountdown();
                statusText.textContent = "New code sent!";
                statusText.style.color = "#24dca2";
            }).catch((error) => {
                console.error("Resend Error:", error);
                
                if (error.code === 'auth/internal-error') {
                    statusText.textContent = "Domain not authorized.";
                } else {
                    statusText.textContent = "Failed to resend code.";
                }
                
                statusText.style.color = "#ff5c5c";
                resendButton.disabled = false;
                
                // Safely reset recaptcha
                if(window.recaptchaVerifier) {
                    window.recaptchaVerifier.render().then(widgetId => {
                        grecaptcha.reset(widgetId);
                    }).catch(resetErr => console.warn("Could not reset reCAPTCHA:", resetErr));
                }
            });
    });

    /* =========================================
       RESTART COMPLETELY
    ========================================= */
    restartButton.addEventListener("click", () => {
        // Reset UI states
        otpCard.classList.remove("verifying", "success", "active");
        phone.classList.remove("verifying", "verified");
        phoneLock.textContent = "🔒";
        phoneButton.textContent = "Verify";
        mainTitle.textContent = "Verify your number";
        statusText.textContent = "";
        otpContainer.classList.remove("hidden");
        timerRow.classList.remove("hidden");
        resendRow.classList.remove("hidden");
        statusRow.classList.remove("hidden");
        successScreen.classList.add("hidden");
        document.getElementById("content").classList.remove("hidden");

        otpInputs.forEach(input => {
            input.value = "";
            input.disabled = false;
            input.classList.remove("filled");
        });
        
        // Go back to input screen
        requestOtpBtn.disabled = false;
        requestOtpBtn.textContent = "Get verification code";
        inputScreen.classList.add("active");
        phoneNumberInput.focus();
    });
</script>

</body>
</html>
