<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP V1 React Series 1 - Firebase Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
    <section class="otp-card" id="otpCard">
        <div class="card-light"></div>

        <div class="phone-area">
            <div class="floating-mail">✉</div>
            <div class="floating-shield">♢</div>

            <div class="phone" id="phone">
                <div class="phone-loader"></div>
                <div class="phone-inner">
                    <div class="phone-status">
                        <span>9:41</span>
                        <span>● ●</span>
                    </div>
                    <div class="phone-lock" id="phoneLock">🔒</div>
                    <button class="phone-button" id="phoneButton">Verify</button>
                    <div class="phone-home"></div>
                </div>
            </div>
        </div>

        <div class="content" id="content">
            <h1 id="mainTitle">Let's verify your number</h1>
            <p id="subtitle">
                We've sent a 6-digit code to your phone.<br>
                It'll auto-verify once entered.
            </p>
        </div>

        <!-- 6-Digit Container -->
        <div class="otp-container" id="otpContainer">
            <input class="otp-input active" maxlength="1" inputmode="numeric" aria-label="OTP digit 1">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 2">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 3">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 4">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 5">
            <input class="otp-input" maxlength="1" inputmode="numeric" aria-label="OTP digit 6">
        </div>

        <div class="status-row" id="statusRow">
            <span id="statusText"></span>
        </div>

        <div class="timer-row" id="timerRow">00:30</div>

        <div class="resend-row" id="resendRow">
            <span>Didn't receive the code?</span>
            <button id="resendButton" disabled>Resend</button>
        </div>

        <div class="success-screen hidden" id="successScreen">
            <div class="success-check">✓</div>
            <h2>Number Verified!</h2>
            <p>Your number has been securely verified</p>
            <button class="success-restart" id="restartButton" aria-label="Verify again">↻</button>
        </div>

        <!-- Required for Firebase Phone Auth -->
        <div id="recaptcha-container"></div>
    </section>
</div>

<!-- Must be type="module" to import Firebase SDKs -->
<script type="module" src="script.js"></script>

</body>
</html>
